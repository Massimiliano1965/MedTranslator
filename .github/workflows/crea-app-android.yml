# MedTranslator — © 2026 Massimiliano Previtali. Tutti i diritti riservati.
# Costruisce l'app Android (APK) su GitHub a ogni modifica.
# Per scaricarla: GitHub → Actions → "Crea app Android" → l'ultima riga verde
# → in fondo, "Artifacts" → MedTranslator-app.
name: Crea app Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Numero di versione che cresce
        # La versione sale a ogni costruzione (1.0.<numero>), così Android accetta l'aggiornamento.
        run: |
          sed -i 's/ version="1\.0\.0"/ version="1.0.${{ github.run_number }}"/' config.xml
          grep -o 'version="[^"]*"' config.xml | head -1
          # Lo stesso numero dentro l'app: serve al controllo aggiornamento
          sed -i 's/var BUILD = 0;/var BUILD = ${{ github.run_number }};/' www/index.html
          grep -c 'var BUILD = ${{ github.run_number }};' www/index.html
      - name: Installa Cordova
        run: npm install -g cordova@12
      - name: Prepara Android, la voce e la ricerca a voce
        run: |
          cordova telemetry off
          cordova platform add android@13
          cordova plugin add cordova-plugin-tts-advanced
          cordova plugin add cordova-plugin-speechrecognition
      - name: Costruisci l'app (firmata sempre con la stessa firma)
        # Firma fissa firma/medtranslator.keystore (vedi build.json): il telefono installa
        # la nuova app SOPRA la vecchia, senza disinstallare.
        run: cordova build android --release --buildConfig=build.json
      - name: Rinomina l'app
        run: cp platforms/android/app/build/outputs/apk/release/app-release.apk MedTranslator.apk
      - name: Controlla la firma
        # Se la firma non è quella fissa, la costruzione si ferma: meglio nessuna app che un'app da disinstallare.
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          FIRMA=$("$APKSIGNER" verify --print-certs MedTranslator.apk | grep -i 'certificate SHA-256' | head -1 | awk '{print $NF}')
          echo "Firma dell'app: $FIRMA"
          test "$FIRMA" = "6126b7bdc5dc28bb5a738de094e24898518875a97a40f810c2f8058347b8e34c"
      - uses: actions/upload-artifact@v4
        with:
          name: MedTranslator-app
          path: MedTranslator.apk
      - name: Pubblica l'APK nella Release "apk-di-prova" (solo da main)
        # Link fisso per scaricare l'app: https://github.com/Massimiliano1965/MedTranslator/releases/download/apk-di-prova/MedTranslator.apk
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-di-prova >/dev/null 2>&1 || gh release create apk-di-prova --title "APK di prova" --notes "Ultima versione di MedTranslator costruita da main." --prerelease
          gh release upload apk-di-prova MedTranslator.apk --clobber
          gh release edit apk-di-prova --title "APK di prova - build ${{ github.run_number }}" --notes "build ${{ github.run_number }}: ultima versione di MedTranslator costruita da main."
