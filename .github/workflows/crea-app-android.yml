# Costruisce l'app Android (APK) su GitHub a ogni modifica.
# Per scaricarla: GitHub → Actions → "Crea app Android" → l'ultima riga verde
# → in fondo, "Artifacts" → MedTranslator-app.
name: Crea app Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Firma sempre uguale e numero di versione che cresce
        # Stessa firma a ogni costruzione (firma/medtranslator.keystore): il telefono
        # installa la nuova app SOPRA la vecchia, senza disinstallare.
        # La versione sale a ogni costruzione (1.0.<numero>), così Android accetta l'aggiornamento.
        run: |
          mkdir -p ~/.android
          cp firma/medtranslator.keystore ~/.android/debug.keystore
          sed -i 's/ version="1\.0\.0"/ version="1.0.${{ github.run_number }}"/' config.xml
          grep -o 'version="[^"]*"' config.xml | head -1
      - name: Installa Cordova
        run: npm install -g cordova@12
      - name: Prepara Android e la voce
        run: |
          cordova telemetry off
          cordova platform add android@13
          cordova plugin add cordova-plugin-tts-advanced
      - name: Costruisci l'app
        run: cordova build android
      - name: Rinomina l'app
        run: cp platforms/android/app/build/outputs/apk/debug/app-debug.apk MedTranslator.apk
      - name: Controlla la firma
        run: |
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs MedTranslator.apk | grep -i "SHA-256"
          echo "Deve essere: 61:26:b7:bd:c5:dc:28:bb:5a:73:8d:e0:94:e2:48:98:51:88:75:a9:7a:40:f8:10:c2:f8:05:83:47:b8:e3:4c
      - uses: actions/upload-artifact@v4
        with:
          name: MedTranslator-app
          path: MedTranslator.apk
