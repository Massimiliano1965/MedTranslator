<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedTranslator</title>
<!--
  MedTranslator — frasi pronte per parlare con pazienti stranieri.
  © 2026 Massimiliano Previtali. Tutti i diritti riservati.

  COME SI USA: scegli la lingua in alto, tocca una frase. Compare grande nella
  lingua del paziente (giri il telefono e la legge) e il telefono la dice a
  voce. Se è una domanda, il paziente risponde toccando i bottoni grandi e tu
  leggi la risposta in italiano.

  PER AGGIUNGERE UNA FRASE: copia una riga dentro FRASI e cambia i testi.
  Ordine sempre: italiano, English, Español, Français, العربية, 中文, 日本語.
  tipo: 'sn' = domanda sì/no, 'dolore' = scala 0-10, scelte = risposte a bottoni.
  ruoli: chi usa la frase. I = infermiere, S = OSS, A = OA, M = medico.
  Ogni frase ha i suoi ruoli (es. 'SA' = la vedono OSS e OA).
  Le traduzioni vanno fatte controllare da un mediatore culturale.
-->
<!-- Font dentro l'app (funziona anche senza internet) -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Colori presi da TrovaReparti: azzurro delle torri, rosso dei civici,
     verde del bottone microfono. Font Atkinson Hyperlegible: disegnato
     per chi vede poco. */
  :root {
    --blu: #1b86c2; --blu-chiaro: #e3f1fa; --rosso: #e0232b; --verde: #2f9e43;
    --sfondo: #f3f6f9; --carta: #ffffff; --bordo: #d8e1e9; --testo: #1b2530; --tenue: #586776;
    --ombra: 0 1px 2px rgba(27, 37, 48, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --blu: #45b3ea; --blu-chiaro: #17303f; --rosso: #f0474e; --verde: #45b85a;
      --sfondo: #11171d; --carta: #1a222b; --bordo: #2b3845; --testo: #e7eef4; --tenue: #9aabbb;
      --ombra: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --blu: #45b3ea; --blu-chiaro: #17303f; --rosso: #f0474e; --verde: #45b85a;
    --sfondo: #11171d; --carta: #1a222b; --bordo: #2b3845; --testo: #e7eef4; --tenue: #9aabbb;
    --ombra: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--sfondo); color: var(--testo);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", "Noto Sans SC", sans-serif;
    font-size: 18px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 3px solid var(--blu); outline-offset: 2px; }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--testata, var(--carta)); border-bottom: 1px solid var(--bordo); border-top: 5px solid var(--blu);
    padding: 12px 16px 10px;
  }
  /* Colore per ruolo (divise): Medico azzurro chiaro istituzionale, OA
     viola-azzurro, OSS bianco e verde scuro, Infermiere bianco candido. */
  body[data-ruolo="M"] { --blu: #3a9ed6; --blu-chiaro: #e3f2fb; --testata: #eaf5fc; }
  body[data-ruolo="A"] { --blu: #5b5bc9; --blu-chiaro: #ebebfb; --testata: #f3f2fe; }
  body[data-ruolo="S"] { --blu: #1f5b3b; --blu-chiaro: #e2eee6; --testata: #ffffff; }
  body[data-ruolo="I"] { --blu: #5f7f9c; --blu-chiaro: #eef3f7; --testata: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body[data-ruolo="M"] { --blu: #5cb2ec; --blu-chiaro: #16303f; --testata: var(--carta); }
    :root:not([data-theme="light"]) body[data-ruolo="A"] { --blu: #9d9cf2; --blu-chiaro: #26254a; --testata: var(--carta); }
    :root:not([data-theme="light"]) body[data-ruolo="S"] { --blu: #6cc793; --blu-chiaro: #17301f; --testata: var(--carta); }
    :root:not([data-theme="light"]) body[data-ruolo="I"] { --blu: #b9cadb; --blu-chiaro: #243039; --testata: var(--carta); }
  }
  :root[data-theme="dark"] body[data-ruolo="M"] { --blu: #5cb2ec; --blu-chiaro: #16303f; --testata: var(--carta); }
  :root[data-theme="dark"] body[data-ruolo="A"] { --blu: #9d9cf2; --blu-chiaro: #26254a; --testata: var(--carta); }
  :root[data-theme="dark"] body[data-ruolo="S"] { --blu: #6cc793; --blu-chiaro: #17301f; --testata: var(--carta); }
  :root[data-theme="dark"] body[data-ruolo="I"] { --blu: #b9cadb; --blu-chiaro: #243039; --testata: var(--carta); }
  .testata { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .marchio { width: 32px; height: 32px; flex: none; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.1; }
  header h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--tenue); margin-top: 2px; }
  .lingue, .ruoli { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .lingue button {
    border: 1.5px solid var(--blu); background: transparent; color: var(--blu);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 15px; font-weight: 700;
  }
  .lingue button.attiva { background: var(--blu); color: #fff; }
  .ruoli { margin-top: 8px; }
  /* Argomenti: una riga sola che scorre di lato, per non alzare la testata */
  /* Argomenti su più righe (non scorrono di lato): così si possono trascinare */
  .gruppi { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .gruppi::-webkit-scrollbar { display: none; }
  .gruppi button {
    flex: none; border: 1px solid var(--bordo); background: transparent; color: var(--tenue); border-radius: 999px;
    padding: 4px 10px; font: inherit; font-size: 13.5px; font-weight: 700; white-space: nowrap;
  }
  .gruppi button.attiva { background: var(--blu); border-color: var(--blu); color: #fff; }
  .ruoli span { font-size: 14px; color: var(--tenue); margin-right: 2px; }
  .ruoli button {
    border: 1px solid var(--bordo); background: var(--sfondo); color: var(--testo); border-radius: 8px;
    padding: 5px 10px; font: inherit; font-size: 14px; font-weight: 700;
  }
  .ruoli button.attiva { background: var(--blu-chiaro); border-color: var(--blu); color: var(--blu); }
  main { padding: 8px 16px 32px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--blu); margin: 22px 4px 8px; }
  /* Frase + stella dei preferiti sulla stessa riga */
  .riga-frase { display: flex; gap: 6px; align-items: stretch; margin: 0 0 8px; }
  .riga-frase .frase { margin: 0; flex: 1; min-width: 0; }
  .stella {
    flex: none; width: 48px; border: 1px solid var(--bordo); border-radius: 12px; background: var(--carta);
    color: var(--tenue); font-size: 24px; line-height: 1; cursor: pointer;
  }
  .stella.piena { color: #e0a400; border-color: #e0a400; }
  h2.titolo-pref { color: #b88600; }
  /* Tasto Ordina e frecce per spostare lingue, ruoli e argomenti */
  .btn-ordina {
    margin-left: auto; flex: none; border: 1px solid var(--blu); background: transparent; color: var(--blu);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 700;
  }
  body.ordinando .btn-ordina { background: var(--blu); color: #fff; }
  .chip-ordina { display: inline-flex; align-items: center; gap: 2px; flex: none; }
  .chip-ordina .freccia {
    border: 0; background: var(--blu-chiaro); color: var(--blu); border-radius: 8px;
    width: 26px; height: 30px; padding: 0; font: inherit; font-size: 20px; font-weight: 700; line-height: 1;
  }
  /* Trascinamento: il bottone preso si solleva, il posto libero è tratteggiato */
  .trascina { touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .preso { box-shadow: 0 6px 16px rgba(0,0,0,0.25); transform: scale(1.08); }
  .fantasma { opacity: 0.35; outline: 2px dashed var(--blu); }
  /* Ruoli: una riga sola, bottoni della stessa larghezza (a capo solo mentre si ordina) */
  body:not(.ordinando) .ruoli { flex-wrap: nowrap; }
  body:not(.ordinando) .ruoli button { flex: 1; min-width: 0; padding-left: 4px; padding-right: 4px; }
  /* Mentre si ordina, gli argomenti vanno a capo invece di scorrere di lato:
     così il bottone spostato resta sempre in vista */
  .frase {
    display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 13px 16px;
    background: var(--carta); color: var(--testo); border: 1px solid var(--bordo); border-radius: 12px;
    box-shadow: var(--ombra); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .frase small { display: block; font-weight: 400; font-size: 16px; color: var(--tenue); margin-top: 3px; }
  .frase:active { background: var(--blu-chiaro); }

  /* Schermata grande per il paziente */
  #grande {
    position: fixed; inset: 0; z-index: 20; background: var(--sfondo); display: none;
    flex-direction: column; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto;
  }
  #grande.aperto { display: flex; }
  .barra { display: flex; justify-content: space-between; gap: 10px; }
  .barra button {
    border: 1px solid var(--bordo); border-radius: 999px; padding: 11px 20px; font: inherit; font-size: 17px; font-weight: 700;
    background: var(--carta); color: var(--testo);
  }
  .barra .ascolta { background: var(--blu); border-color: var(--blu); color: #fff; }
  #g-testo { font-size: 34px; font-weight: 700; line-height: 1.3; margin: 28px 0 14px; text-wrap: balance; }
  #g-testo[dir="rtl"] { font-size: 38px; }
  #g-it { font-size: 17px; color: var(--tenue); margin: 0 0 20px; }
  .risposte { display: grid; gap: 12px; margin-top: auto; }
  .risposte.due { grid-template-columns: 1fr 1fr; }
  .risposte button {
    border: 0; border-radius: 16px; padding: 22px 10px; font: inherit; font-size: 26px; font-weight: 700;
    color: #fff; background: var(--verde);
  }
  .risposte .no { background: var(--rosso); }
  .risposte .altra { background: var(--blu); }
  .scala { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: auto; }
  .scala button {
    border: 0; border-radius: 12px; padding: 16px 0; font: inherit; font-size: 24px; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .scala-etichette { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; margin-top: 8px; }
  #g-risposta {
    display: none; margin-top: 18px; padding: 18px; border-radius: 16px; background: var(--carta); color: var(--testo);
    border: 3px solid var(--blu); font-size: 30px; font-weight: 700; text-align: center;
  }
  #g-risposta small { display: block; font-size: 15px; font-weight: 400; color: var(--tenue); margin-bottom: 4px; }

  /* Tabella a immagini (paziente che non può parlare) */
  .tabella { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .tabella button {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 8px;
    background: var(--carta); color: var(--testo); border: 3px solid var(--bordo); border-radius: 16px; font: inherit;
  }
  .tabella button:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .tabella .simbolo { font-size: 40px; line-height: 1.1; }
  .tabella b { font-size: 21px; line-height: 1.2; }
  .tabella small { font-size: 14px; color: var(--tenue); }
  .tabella button.accesa { border-color: var(--blu); background: var(--blu-chiaro); transform: scale(1.03); }
  .scorri { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .scorri button { border: 0; border-radius: 16px; padding: 18px 8px; font: inherit; font-size: 22px; font-weight: 700; color: #fff; background: var(--blu); }
  .scorri .questa { background: var(--verde); }
  .aiuto-tabella { font-size: 15px; color: var(--tenue); margin: 10px 2px 0; }
  @media (prefers-reduced-motion: reduce) { .tabella button.accesa { transform: none; } }

  /* Firma dell'ideatore */
  .firma {
    margin-top: 36px; padding: 22px 16px 10px; border-top: 1px solid var(--bordo);
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  }
  .firma .marchio { width: 40px; height: 40px; margin-bottom: 4px; }
  .firma-etichetta { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--tenue); }
  .firma-nome { font-family: "Caveat", "Segoe Script", "Brush Script MT", cursive; font-size: 36px; font-weight: 600; line-height: 1.1; color: var(--blu); }
  .firma-nota { font-size: 13px; color: var(--tenue); max-width: 34ch; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  /* Avvio: logo su verdino (come quello di Android), poi il fumetto con i
     saluti nelle 13 lingue, poi "Benvenuto". Toccando lo schermo si salta. */
  #avvio {
    position: fixed; inset: 0; z-index: 50; background: #e4f5e8; overflow: hidden;
    display: flex; align-items: center; justify-content: center; transition: opacity .35s;
  }
  #avvio.via { opacity: 0; pointer-events: none; }
  #avvio .scena { position: relative; width: 320px; height: 320px; flex: none; }
  #avvio .logo { position: absolute; left: 85px; top: 85px; width: 150px; height: 150px; transition: all .5s cubic-bezier(.3,1.3,.5,1); z-index: 2; }
  #avvio.fase2 .logo { left: 0; top: 214px; width: 96px; height: 96px; }
  #avvio .fumetto {
    position: absolute; left: 36px; top: 16px; width: 284px; height: 172px; background: #fff; border-radius: 36px;
    box-shadow: 0 10px 30px rgba(31, 90, 50, 0.18); transform: scale(0); transform-origin: 20% 110%;
    transition: transform .45s cubic-bezier(.3,1.4,.5,1) .15s; display: flex; align-items: center; justify-content: center; overflow: visible;
  }
  #avvio .fumetto::after {   /* la punta del fumetto, verso il logo */
    content: ""; position: absolute; left: 34px; bottom: -30px; width: 44px; height: 40px; background: #fff;
    clip-path: polygon(0 0, 100% 0, 8% 100%);
  }
  #avvio.fase2 .fumetto { transform: scale(1); }
  #avvio .saluti { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 36px; }
  #avvio .saluti span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 16px; font-size: 46px; font-weight: 700; line-height: 1.15; color: #1f7a33;
    font-family: "Atkinson Hyperlegible", system-ui, "Noto Sans", "Noto Sans Arabic", "Noto Sans SC", "Noto Sans JP", "Noto Sans Gurmukhi", sans-serif;
    transform: translateY(70%); opacity: 0; transition: transform .22s ease-out, opacity .22s ease-out;
  }
  #avvio .saluti span.lungo { font-size: 34px; }
  #avvio .saluti span.dentro { transform: none; opacity: 1; }
  #avvio .saluti span.fuori { transform: translateY(-70%); opacity: 0; }
  #avvio .saluti span.benvenuto { flex-direction: column; font-size: 38px; }
  #avvio .saluti span.benvenuto small { font-size: 17px; font-weight: 400; color: #4d6b55; margin-top: 4px; }
  #avvio .nome {
    position: absolute; left: 0; right: 0; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); text-align: center;
    opacity: 0; transition: opacity .5s .3s; color: #1f7a33;
  }
  #avvio.fase2 .nome { opacity: 1; }
  #avvio .nome b { display: block; font-size: 28px; }
  #avvio .nome small { display: block; font-size: 14px; color: #4d6b55; margin-top: 4px; }
  @media (max-width: 352px) { #avvio .scena { transform: scale(.88); } }
  @media (prefers-reduced-motion: reduce) {
    #avvio .logo, #avvio .fumetto, #avvio .saluti span { transition: none; }
    #avvio .saluti span, #avvio .saluti span.fuori { transform: none; }
  }
</style>
</head>
<body>
<div id="avvio" aria-label="MedTranslator">
  <div class="scena">
    <div class="fumetto"><div class="saluti" id="saluti"></div></div>
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#2f9e43"/><path d="M26 40H50A10 10 0 0 1 60 50V62A10 10 0 0 1 50 72H36L18 84L26 72A10 10 0 0 1 16 62V50A10 10 0 0 1 26 40Z" fill="#fff" fill-opacity=".55"/><path d="M49 20H73A11 11 0 0 1 84 31V47A11 11 0 0 1 73 58L82 70L63 58H49A11 11 0 0 1 38 47V31A11 11 0 0 1 49 20Z" fill="#fff"/><path d="M57.5 29h7v6.5h6.5v7h-6.5v6.5h-7v-6.5h-6.5v-7h6.5z" fill="#2f9e43"/></svg>
  </div>
  <div class="nome"><b>MedTranslator</b><small>Tocca lo schermo per saltare</small></div>
</div>
<header>
  <div class="testata">
    <svg class="marchio" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" style="fill:var(--blu)"/><path d="M8 11.5h9a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3h-4l-3.5 3v-3H8a0 0 0 0 1 0 0z" fill="#fff" opacity=".55"/><path d="M13 8h8a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-1v3l-3.5-3H13a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3z" fill="#fff"/></svg>
    <h1>MedTranslator<small>Frasi pronte per parlare con i pazienti</small></h1>
  </div>
  <div class="lingue" id="lingue"></div>
  <div class="ruoli" id="ruoli"></div>
  <div class="gruppi" id="gruppi"></div>
</header>
<main id="elenco"></main>

<div id="grande" role="dialog" aria-modal="true">
  <div class="barra">
    <button type="button" onclick="chiudi()">✕ Chiudi</button>
    <button type="button" class="ascolta" onclick="parla()">🔊 Ascolta</button>
  </div>
  <div id="g-testo"></div>
  <p id="g-it"></p>
  <div id="g-risposte"></div>
  <div id="g-risposta"></div>
</div>

<script src="lib/Sortable.min.js"></script>
<script src="cordova.js"></script>
<script>
  var LINGUE = [
    { id: 'en', nome: 'English', voce: 'en-GB' },
    { id: 'es', nome: 'Español', voce: 'es-ES' },
    { id: 'fr', nome: 'Français', voce: 'fr-FR' },
    { id: 'ar', nome: 'العربية', voce: 'ar-SA', rtl: true },
    { id: 'zh', nome: '中文', voce: 'zh-CN' },
    { id: 'ja', nome: '日本語', voce: 'ja-JP' },
    { id: 'ur', nome: 'اردو', voce: 'ur-PK', rtl: true },
    { id: 'ro', nome: 'Română', voce: 'ro-RO' },
    { id: 'sq', nome: 'Shqip', voce: 'sq-AL' },
    { id: 'pa', nome: 'ਪੰਜਾਬੀ', voce: 'pa-IN' },
    { id: 'uk', nome: 'Українська', voce: 'uk-UA' },
    { id: 'ru', nome: 'Русский', voce: 'ru-RU' }
  ];
  // Risposte Sì / No
  var SI = ['Sì', 'Yes', 'Sí', 'Oui', 'نعم', '是', 'はい'];
  var NO = ['No', 'No', 'No', 'Non', 'لا', '否', 'いいえ'];
  var DOLORE_0 = ['Nessun dolore', 'No pain', 'Sin dolor', 'Aucune douleur', 'لا ألم', '不疼', '痛みなし'];
  // Tabella a immagini per chi non può parlare: [simbolo, it, en, es, fr, ar, zh, ja]
  var TABELLA = [
    ['✅', 'Sì', 'Yes', 'Sí', 'Oui', 'نعم', '是', 'はい'],
    ['❌', 'No', 'No', 'No', 'Non', 'لا', '否', 'いいえ'],
    ['🤕', 'Dolore', 'Pain', 'Dolor', 'Douleur', 'ألم', '疼痛', '痛み'],
    ['💧', 'Sete', 'Thirst', 'Sed', 'Soif', 'عطش', '口渴', '喉の渇き'],
    ['🥶', 'Freddo', 'Cold', 'Frío', 'Froid', 'برد', '冷', '寒い'],
    ['🥵', 'Caldo', 'Hot', 'Calor', 'Chaud', 'حر', '热', '暑い'],
    ['🚽', 'Bagno', 'Toilet', 'Baño', 'Toilettes', 'الحمّام', '厕所', 'トイレ'],
    ['😨', 'Paura', 'Fear', 'Miedo', 'Peur', 'خوف', '害怕', '怖い'],
    ['👪', 'Chiamare un familiare', 'Call my family', 'Llamar a mi familia', 'Appeler ma famille', 'الاتصال بعائلتي', '叫我的家人', '家族を呼んで']
  ];
  var casella = -1;
  var DOLORE_10 = ['Dolore massimo', 'Worst pain', 'Dolor máximo', 'Douleur maximale', 'أشد ألم', '最疼', '最もひどい痛み'];

  // Ordine: italiano, English, Español, Français, العربية, 中文

    var stella = preferite.indexOf(f.t[0]) !== -1;
    return '<div class="riga-frase"><button type="button" class="frase" onclick="apri(' + i + ')">' + esc(f.t[0]) +
      '<small lang="' + info().id + '"' + (info().rtl ? ' dir="rtl"' : '') + '>' + esc(f.t[lingua]) + '</small></button>' +
      '<button type="button" class="stella' + (stella ? ' piena' : '') + '" aria-pressed="' + stella + '" aria-label="' + (stella ? 'Togli dai preferiti' : 'Aggiungi ai preferiti') + '" onclick="alternaPreferita(' + i + ')">' + (stella ? '★' : '☆') + '</button></div>';
  }

  function disegna() {
    // Lingue
    viste.lingue = ordinaSecondo(LINGUE.map(function (l, i) { return i + 1; }), ordLingue);
    document.getElementById('lingue').innerHTML = viste.lingue.map(function (n, k) {
      var l = LINGUE[n - 1];
      return chip('lingue', k, '<button type="button" class="' + (n === lingua ? 'attiva' : '') + '" lang="' + l.id + '" onclick="scegliLingua(' + n + ')">' + l.nome + '</button>');
    }).join('');
    // Chi sei
    viste.ruoli = ordinaSecondo(RUOLI.map(function (r) { return r[0]; }), ordRuoli);
    document.getElementById('ruoli').innerHTML = viste.ruoli.map(function (codice, k) {
      var r = RUOLI.filter(function (x) { return x[0] === codice; })[0];
      return chip('ruoli', k, '<button type="button" class="' + (codice === ruolo ? 'attiva' : '') + '" title="' + r[2] + '" aria-label="' + r[2] + '" onclick="scegliRuolo(\'' + codice + '\')">' + r[1] + '</button>');
    }).join('');
    document.body.setAttribute('data-ruolo', ruolo);
    // Argomenti che hanno almeno una frase per il ruolo scelto, nell'ordine scelto
    var disponibili = [], nomeGruppo = '', rg = '';
    FRASI.forEach(function (f) {
      if (f.gruppo) { nomeGruppo = f.gruppo; rg = f.ruoli; return; }
      if (ruolo && (f.ruoli || rg).indexOf(ruolo) === -1) return;
      if (disponibili.indexOf(nomeGruppo) === -1) disponibili.push(nomeGruppo);
    });
    viste.gruppi = ordinaSecondo(disponibili, ordGruppi.concat(disponibili.filter(function (g) { return ordGruppi.indexOf(g) === -1; })));
    if (gruppo === '__pref' && !preferite.length) gruppo = '';
    if (gruppo && gruppo !== '__pref' && disponibili.indexOf(gruppo) === -1) gruppo = '';
    var fissi = '<button type="button" class="' + (gruppo === '' ? 'attiva' : '') + '" onclick="scegliGruppo(\'\')">Tutti gli argomenti</button>' +
      (preferite.length ? '<button type="button" class="' + (gruppo === '__pref' ? 'attiva' : '') + '" onclick="scegliGruppo(\'__pref\')">★ Le mie frasi</button>' : '');
    document.getElementById('gruppi').innerHTML = fissi + viste.gruppi.map(function (g, k) {
      return chip('gruppi', k, '<button type="button" class="' + (g === gruppo ? 'attiva' : '') + '" onclick="scegliGruppo(' + JSON.stringify(g).replace(/"/g, '&quot;') + ')">' + esc(g) + '</button>');
    }).join('');
    // Frasi: prima le preferite, poi gli argomenti nell'ordine scelto
    var html = '';
    if (preferite.length && (gruppo === '' || gruppo === '__pref')) {
      var pref = '';
      FRASI.forEach(function (f, i) { if (!f.gruppo && preferite.indexOf(f.t[0]) !== -1) pref += rigaFrase(f, i); });
      if (pref) html += '<h2 class="titolo-pref">★ Le mie frasi</h2>' + pref;
    }
    if (gruppo !== '__pref') {
      var perGruppo = {}, ruoliGruppo = '', gruppoAttuale = '';
      FRASI.forEach(function (f, i) {
        if (f.gruppo) { ruoliGruppo = f.ruoli; gruppoAttuale = f.gruppo; return; }
        if (ruolo && (f.ruoli || ruoliGruppo).indexOf(ruolo) === -1) return;
        if (gruppo && gruppoAttuale !== gruppo) return;
        (perGruppo[gruppoAttuale] = perGruppo[gruppoAttuale] || []).push(rigaFrase(f, i));
      });
      viste.gruppi.forEach(function (g) { if (perGruppo[g]) html += '<h2>' + esc(g) + '</h2>' + perGruppo[g].join(''); });
    }
    html += '<footer class="firma">' + MARCHIO_SVG +
      '<span class="firma-etichetta">Ideazione e design</span>' +
      '<span class="firma-nome">Massimiliano Previtali</span>' +
      '<span class="firma-nota">© 2026 · Traduzioni da far controllare a un mediatore culturale.</span></footer>';
    document.getElementById('elenco').innerHTML = html;
    attivaTrascina();
  }

  // Tieni premuto un bottone (lingua, ruolo, argomento) e trascinalo per
  // cambiargli posto. L'ordine resta salvato sul telefono.
  var ordinatori = [], appenaTrascinato = 0;
  function attivaTrascina() {
    if (typeof Sortable === 'undefined') return;
    ordinatori.forEach(function (o) { o.destroy(); });
    ordinatori = [['lingue', 'trad_ordine_lingue'], ['ruoli', 'trad_ordine_ruoli'], ['gruppi', 'trad_ordine_gruppi']].map(function (r) {
      return Sortable.create(document.getElementById(r[0]), {
        draggable: '.trascina', animation: 150, delay: 220, delayOnTouchOnly: true, forceFallback: true,
        fallbackTolerance: 4, ghostClass: 'fantasma', chosenClass: 'preso', scroll: true, bubbleScroll: true,
        onEnd: function () {
          appenaTrascinato = Date.now();
          var ordine = Array.prototype.map.call(document.querySelectorAll('#' + r[0] + ' .trascina'), function (b) {
            var v = b.getAttribute('data-k'); return r[0] === 'lingue' ? +v : v;
          });
          if (r[0] === 'lingue') ordLingue = ordine;
          if (r[0] === 'ruoli') ordRuoli = ordine;
          if (r[0] === 'gruppi') ordGruppi = ordine;
          salva(r[1], ordine);
          setTimeout(disegna, 0);
        }
      });
    });
  }
  function daTrascinamento() { return Date.now() - appenaTrascinato < 400; }

  var gruppo = '', GRUPPI_VISTI = [];
  try { gruppo = localStorage.getItem('trad_gruppo') || ''; } catch (e) {}
  function scegliGruppo(g) {
    if (daTrascinamento()) return;
    gruppo = g;
    try { localStorage.setItem('trad_gruppo', gruppo); } catch (e) {}
    disegna();
    window.scrollTo(0, 0);
  }

  function scegliLingua(n) {
    if (daTrascinamento()) return;
    lingua = n;
    try { localStorage.setItem('trad_lingua', String(n)); } catch (e) {}
    disegna();
  }

  function apri(i) {
    var f = FRASI[i]; aperta = f;
    var t = document.getElementById('g-testo');
    t.textContent = f.t[lingua];
    t.setAttribute('lang', info().id);
    t.setAttribute('dir', info().rtl ? 'rtl' : 'ltr');
    document.getElementById('g-it').textContent = f.t[0];
    var r = document.getElementById('g-risposte');
    var rtl = info().rtl ? ' dir="rtl"' : '';
    if (f.tipo === 'sn') {
      r.innerHTML = '<div class="risposte due"' + rtl + '>' +
        '<button type="button" onclick="risposta(\'Sì\')">✓ ' + SI[lingua] + '</button>' +
        '<button type="button" class="no" onclick="risposta(\'No\')">✕ ' + NO[lingua] + '</button></div>';
    } else if (f.scelte) {
      r.innerHTML = '<div class="risposte"' + rtl + '>' + f.scelte.map(function (s, k) {
        return '<button type="button" class="' + (k === f.scelte.length - 1 ? 'altra' : '') + '" onclick="risposta(\'' + s[0].replace(/'/g, "\\'") + '\')">' + esc(s[lingua]) + '</button>';
      }).join('') + '</div>';
    } else if (f.tipo === 'dolore') {
      var colori = ['#2e9e44', '#4fa83d', '#79b236', '#a3b92f', '#c9b82a', '#e0a526', '#e58a24', '#e36c22', '#d9501f', '#c9351f', '#b01c1c'];
      var b = '';
      for (var n = 0; n <= 10; n++) b += '<button type="button" style="background:' + colori[n] + '" onclick="risposta(\'Dolore ' + n + ' su 10\')">' + n + '</button>';
      r.innerHTML = '<div class="scala" dir="ltr">' + b + '</div><div class="scala-etichette" dir="ltr"><span>0 = ' + esc(DOLORE_0[lingua]) + '</span><span>10 = ' + esc(DOLORE_10[lingua]) + '</span></div>';
    } else if (f.tipo === 'tabella') {
      casella = -1;
      r.innerHTML = '<div class="tabella"' + rtl + '>' + TABELLA.map(function (c, k) {
        return '<button type="button" id="casella-' + k + '" onclick="scegliCasella(' + k + ')"><span class="simbolo" aria-hidden="true">' + c[0] + '</span>' +
          '<b lang="' + info().id + '">' + esc(c[lingua + 1]) + '</b><small>' + esc(c[1]) + '</small></button>';
      }).join('') + '</div>' +
        '<div class="scorri"><button type="button" onclick="avantiCasella()">▶ Avanti</button><button type="button" class="questa" onclick="scegliCasella(casella)">✓ Questa!</button></div>' +
        '<p class="aiuto-tabella">Tocca <b>Avanti</b>: le caselle si accendono una alla volta e il telefono le legge nella lingua del paziente. Quando il paziente chiude gli occhi, tocca <b>Questa!</b> Se il paziente può indicare, tocca direttamente la casella.</p>';
    } else r.innerHTML = '';
    document.getElementById('g-risposta').style.display = 'none';
    document.getElementById('grande').classList.add('aperto');
    document.getElementById('grande').scrollTop = 0;
    parla();
  }

  // Risposta del paziente: grande, in italiano, per chi assiste.
  function risposta(it) {
    var g = document.getElementById('g-risposta');
    g.innerHTML = '<small>Il paziente ha risposto:</small>' + esc(it);
    g.style.display = 'block';
    g.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  // Tabella: accende la casella successiva e la legge a voce.
  function avantiCasella() {
    if (casella >= 0) document.getElementById('casella-' + casella).classList.remove('accesa');
    casella = (casella + 1) % TABELLA.length;
    var el = document.getElementById('casella-' + casella);
    el.classList.add('accesa');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    parlaTesto(TABELLA[casella][lingua + 1]);
  }
  function scegliCasella(k) {
    if (k < 0) return;
    if (casella >= 0) document.getElementById('casella-' + casella).classList.remove('accesa');
    casella = k;
    document.getElementById('casella-' + k).classList.add('accesa');
    risposta(TABELLA[k][1]);
  }

  function chiudi() {
    document.getElementById('grande').classList.remove('aperto');
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (window.TTS && window.TTS.stop) { try { window.TTS.stop(); } catch (e) {} }
    aperta = null;
  }

  function parla() {
    if (aperta) parlaTesto(aperta.t[aperta.tipo === 'tabella' ? lingua : lingua]);
  }
  function parlaTesto(testo) {
    // Nell'app Android la voce passa dal plugin TTS (la voce del telefono);
    // nel browser si usa speechSynthesis.
    if (window.TTS && window.TTS.speak) {
      try { window.TTS.speak({ text: testo.replace(/\.\.\.|……/g, ''), locale: info().voce, rate: 0.9 }, function () {}, function () {}); } catch (e) {}
      return;
    }
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(testo.replace(/\.\.\.|……/g, ''));
    u.lang = info().voce; u.rate = 0.9;
    var v = speechSynthesis.getVoices().filter(function (x) { return x.lang && x.lang.replace('_', '-').indexOf(info().id) === 0; });
    if (v.length) u.voice = v[0];
    speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) speechSynthesis.getVoices();


  // Avvio: logo, poi i saluti nelle 13 lingue che scorrono nel fumetto, poi
  // "Benvenuto" e si apre l'app. Toccando lo schermo si salta.
  var avvio = (function () {
    var el = document.getElementById('avvio'), box = document.getElementById('saluti');
    // Il giapponese per primo (è quello di Massi), il francese per ultimo.
    var SALUTI = [['ja', 'こんにちは'], ['it', 'Ciao'], ['en', 'Hello'], ['es', 'Hola'], ['ar', 'مرحبا', 1],
      ['zh', '你好'], ['ur', 'السلام علیکم', 1], ['ro', 'Bună'], ['sq', 'Përshëndetje'],
      ['pa', 'ਸਤ ਸ੍ਰੀ ਅਕਾਲ'], ['uk', 'Вітаю'], ['ru', 'Здравствуйте'], ['fr', 'Bonjour']];
    var timer = [], finito = false, prima = null;
    function dopo(ms, f) { timer.push(setTimeout(f, ms)); }
    function mostra(lang, html, rtl, classe) {
      var sp = document.createElement('span');
      sp.lang = lang; sp.dir = rtl ? 'rtl' : 'ltr'; sp.className = classe || '';
      sp.innerHTML = html; box.appendChild(sp);
      sp.offsetWidth;   // fa partire l'animazione
      sp.classList.add('dentro');
      if (prima) { var p = prima; p.classList.add('fuori'); setTimeout(function () { p.remove(); }, 300); }
      prima = sp;
    }
    function fine() {
      if (finito) return; finito = true;
      timer.forEach(clearTimeout);
      el.classList.add('via');
      setTimeout(function () { el.remove(); }, 400);
    }
    // Il primo tempo lo fa Android (logo su verdino): qui il logo resta fermo
    // un attimo nello stesso punto, poi arriva il fumetto.
    dopo(900, function () { el.classList.add('fase2'); });
    SALUTI.forEach(function (x, k) {
      dopo(1400 + k * 360, function () { mostra(x[0], esc(x[1]), x[2], x[1].length > 8 ? 'lungo' : ''); });
    });
    var t = 1400 + SALUTI.length * 360;
    dopo(t, function () { mostra('it', 'Benvenuto<small>in MedTranslator</small>', 0, 'benvenuto'); });
    dopo(t + 1300, fine);
    el.addEventListener('pointerdown', fine);
    return { aperto: function () { return !finito; }, fine: fine };
  })();

  // Tasto Indietro di Android: chiude la frase aperta invece di uscire.
  window.addEventListener('popstate', function () { if (aperta) chiudi(); });
  // App Android: il tasto Indietro chiude la frase aperta; se non c'è niente di aperto, esce.
  document.addEventListener('backbutton', function (e) {
    e.preventDefault();
    if (avvio.aperto()) avvio.fine();
    else if (aperta) chiudi(); else if (navigator.app && navigator.app.exitApp) navigator.app.exitApp();
  }, false);
  var apriOriginale = apri;
  apri = function (i) { apriOriginale(i); try { history.pushState({ f: i }, ''); } catch (e) {} };
  var chiudiOriginale = chiudi;
  chiudi = function () { var era = aperta; chiudiOriginale(); if (era && history.state && history.state.f !== undefined) history.back(); };

  disegna();
</script>
</body>
</html>
