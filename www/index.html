<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traduttore reparto</title>
<!--
  Traduttore di reparto — frasi pronte per parlare con pazienti stranieri.
  © 2026 Massimiliano Previtali. Tutti i diritti riservati.

  COME SI USA: all'avvio scegli la tua lingua e il tuo lavoro (infermiere, OSS, OA, medico),
  poi la lingua in alto e tocca una frase. Compare grande nella
  lingua del paziente (giri il telefono e la legge) e il telefono la dice a
  voce. Se è una domanda, il paziente risponde toccando i bottoni grandi e tu
  leggi la risposta in italiano.

  PER AGGIUNGERE UNA FRASE: copia una riga dentro FRASI e cambia i testi.
  Ordine sempre: italiano, English, Español, Français, العربية, 中文, 日本語.
  tipo: 'sn' = domanda sì/no, 'dolore' = scala 0-10, scelte = risposte a bottoni.
  ruoli: chi usa la frase. I = infermiere, S = OSS, A = OA, M = medico.
  Ogni frase ha i suoi ruoli (es. 'SA' = la vedono OSS e OA).
  Le traduzioni vanno fatte controllare da un mediatore culturale.
-->
<!-- Font dentro l'app (funziona anche senza internet) -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Colori scelti da Massi: giorno "Menta e cielo" (sfondo verdino chiarissimo,
     azzurro per i bottoni), notte "Blu notte". */
  :root {
    --blu: #3a9ed6; --blu-chiaro: #dcecf5; --chip: #dcecf5; --rosso: #E53935; --verde: #34a847;
    --sfondo: #eef8f2; --carta: #ffffff; --bordo: #d3e6dc; --testo: #24323a; --tenue: #647580; --testata: #f6fbf8;
    --ombra: 0 2px 6px rgba(36,50,58,0.07); --lg1: #e4f4ec; --lg2: #deedf6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --blu: #5cb2ec; --blu-chiaro: #1c2c3d; --chip: #1c2c3d; --rosso: #f0474e; --verde: #45b85a;
      --sfondo: #0e1620; --carta: #16222f; --bordo: #24364a; --testo: #e4edf5; --tenue: #98a9ba; --testata: #111b27;
      --ombra: none; --lg1: #182a2a; --lg2: #1a2838;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --blu: #5cb2ec; --blu-chiaro: #1c2c3d; --chip: #1c2c3d; --rosso: #f0474e; --verde: #45b85a;
    --sfondo: #0e1620; --carta: #16222f; --bordo: #24364a; --testo: #e4edf5; --tenue: #98a9ba; --testata: #111b27;
    --ombra: none; --lg1: #182a2a; --lg2: #1a2838;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--sfondo); color: var(--testo);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Noto Sans Arabic", "Noto Sans SC", sans-serif;
    font-size: 18px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 3px solid var(--blu); outline-offset: 2px; }
  header {
    /* La barra parte dal bordo in alto e copre anche la zona dell'ora e della
       batteria: così le frasi non si vedono scorrere dietro. */
    position: sticky; top: 0; z-index: 5;
    background: var(--testata, var(--carta)); border-bottom: 1px solid var(--bordo); border-top: 6px solid var(--ruolo);
    padding: calc(8px + env(safe-area-inset-top, 0px)) 0 6px;
  }
  /* Colore del ruolo (divise): solo la barra in alto e il bottone del ruolo.
     Medico blu istituzionale, OA viola-azzurro, OSS verde, Infermiere grigio-azzurro. */
  body { --ruolo: var(--blu); --ruolo-testo: #ffffff; }
  body[data-ruolo="M"] { --ruolo: #1f4e8c; } body[data-ruolo="A"] { --ruolo: #5b5bc9; }
  body[data-ruolo="S"] { --ruolo: #2e7d4f; } body[data-ruolo="I"] { --ruolo: #5f7f9c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { --ruolo-testo: #0e1620; }
    :root:not([data-theme="light"]) body[data-ruolo="M"] { --ruolo: #7fa8e6; } :root:not([data-theme="light"]) body[data-ruolo="A"] { --ruolo: #9d9cf2; }
    :root:not([data-theme="light"]) body[data-ruolo="S"] { --ruolo: #6cc793; } :root:not([data-theme="light"]) body[data-ruolo="I"] { --ruolo: #b9cadb; }
  }
  :root[data-theme="dark"] body { --ruolo-testo: #0e1620; }
  :root[data-theme="dark"] body[data-ruolo="M"] { --ruolo: #7fa8e6; } :root[data-theme="dark"] body[data-ruolo="A"] { --ruolo: #9d9cf2; }
  :root[data-theme="dark"] body[data-ruolo="S"] { --ruolo: #6cc793; } :root[data-theme="dark"] body[data-ruolo="I"] { --ruolo: #b9cadb; }
  .testata { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; padding: 0 16px; }
  .marchio { width: 28px; height: 28px; flex: none; }
  header h1 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.1; flex: 1; min-width: 0; white-space: nowrap; }
  /* Bottone del ruolo scelto: toccandolo si torna alla schermata di benvenuto */
  .btn-ruolo {
    flex: none; border: 0; background: var(--ruolo); color: var(--ruolo-testo);
    border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 14px; font-weight: 700; white-space: nowrap;
  }
  .btn-ruolo span { font-weight: 400; opacity: .8; }
  /* Lente di ricerca e barra di ricerca (prende il posto della riga del titolo) */
  .btn-lente {
    flex: none; width: 36px; height: 36px; padding: 7px; border: 0; border-radius: 50%;
    background: var(--chip); color: var(--testo);
  }
  .btn-lente svg { width: 100%; height: 100%; display: block; }
  /* Giorno / notte: automatico (segue il telefono), sempre giorno, sempre notte */
  .btn-tema {
    flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%;
    background: var(--chip); font-size: 19px; line-height: 36px; text-align: center;
  }
  .btn-tema small { font-size: 9px; font-weight: 800; position: relative; top: -1px; margin-left: -2px; color: var(--testo); }
  .avviso {
    position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30;
    background: var(--testo); color: var(--sfondo); padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 15px;
    pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap;
  }
  .avviso.visibile { opacity: 1; }
  .cerca { display: none; gap: 8px; align-items: center; margin: 0 0 6px; padding: 0 16px; }
  body.cercando .cerca { display: flex; }
  body.cercando .testata, body.cercando .gruppi { display: none; }
  .cerca input {
    flex: 1; min-width: 0; height: 42px; padding: 0 16px; border-radius: 21px; border: 1.5px solid var(--blu);
    background: var(--carta); color: var(--testo); font: inherit; font-size: 17px;
  }
  .cerca button {
    flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--chip);
    color: var(--testo); font: inherit; font-size: 18px; font-weight: 700;
  }
  .cerca input::-webkit-search-cancel-button { display: none; }
  .cerca input:focus { outline: none; border-width: 2px; }
  .nessuna { text-align: center; color: var(--tenue); margin: 32px 16px; font-size: 17px; }
  /* Lingue e argomenti: UNA riga sola ciascuno, che scorre di lato col dito.
     Così la testata resta bassa e lo schermo resta alle frasi. */
  .lingue, .gruppi {
    display: flex; flex-wrap: nowrap; gap: 6px; align-items: center;
    overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding: 0 16px;
  }
  .lingue::-webkit-scrollbar, .gruppi::-webkit-scrollbar { display: none; }
  .lingue button {
    flex: none; border: 0; background: linear-gradient(135deg, var(--lg1), var(--lg2)); color: var(--testo); white-space: nowrap; box-shadow: var(--ombra);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 15px; font-weight: 700;
  }
  .lingue button.attiva { background: var(--blu); color: #fff; }
  .gruppi { margin-top: 6px; }
  .gruppi button {
    flex: none; border: 0; background: var(--chip); color: var(--testo); border-radius: 999px;
    padding: 4px 10px; font: inherit; font-size: 13.5px; font-weight: 700; white-space: nowrap;
  }
  .gruppi button.attiva { background: var(--blu); color: #fff; }
  main { padding: 8px 16px 32px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; color: var(--tenue); margin: 20px 4px 8px; }
  /* Frase + stella dei preferiti sulla stessa riga */
  .riga-frase { display: flex; gap: 6px; align-items: stretch; margin: 0 0 8px; }
  .riga-frase .frase { margin: 0; flex: 1; min-width: 0; }
  .stella {
    flex: none; width: 48px; border: 0; border-radius: 16px; background: linear-gradient(135deg, rgba(245,196,0,0.10), rgba(245,196,0,0.20)); box-shadow: var(--ombra);
    color: var(--tenue); font-size: 24px; line-height: 1; cursor: pointer;
  }
  .stella { color: #d4a300; }
  .stella.piena { color: #d4a300; background: rgba(245,196,0,0.3); }
  h2.titolo-pref { color: #b88600; }
  /* Tasto Ordina e frecce per spostare lingue, ruoli e argomenti */
  .btn-ordina {
    margin-left: auto; flex: none; border: 1px solid var(--blu); background: transparent; color: var(--blu);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 700;
  }
  body.ordinando .btn-ordina { background: var(--blu); color: #fff; }
  .chip-ordina { display: inline-flex; align-items: center; gap: 2px; flex: none; }
  .chip-ordina .freccia {
    border: 0; background: var(--blu-chiaro); color: var(--blu); border-radius: 8px;
    width: 26px; height: 30px; padding: 0; font: inherit; font-size: 20px; font-weight: 700; line-height: 1;
  }
  /* Trascinamento: il bottone preso si solleva, il posto libero è tratteggiato */
  .trascina { touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .preso { box-shadow: 0 6px 16px rgba(0,0,0,0.25); transform: scale(1.08); }
  .fantasma { opacity: 0.35; outline: 2px dashed var(--blu); }
  /* Mentre si ordina, gli argomenti vanno a capo invece di scorrere di lato:
     così il bottone spostato resta sempre in vista */
  .frase {
    display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 13px 16px;
    background: linear-gradient(135deg, var(--lg1), var(--lg2)); color: var(--testo); border: 2px solid transparent; border-radius: 16px;
    box-shadow: var(--ombra); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .frase > span { display: block; }
  .frase [dir="rtl"] { text-align: right; }
  .frase small { display: block; font-weight: 400; font-size: 16px; color: var(--tenue); margin-top: 3px; }
  .frase:active { background: var(--blu-chiaro); }

  /* Schermata di benvenuto: all'avvio si sceglie il proprio lavoro */
  #benvenuto {
    position: fixed; inset: 0; z-index: 15; background: var(--sfondo); display: none; overflow-y: auto;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  #benvenuto.aperto { display: block; }
  .bv { max-width: 520px; margin: 0 auto; padding: 28px 16px 16px; }
  .bv-logo { display: flex; justify-content: center; }
  .bv-logo .marchio { width: 64px; height: 64px; }
  .bv h1 { margin: 12px 0 4px; font-size: 32px; font-weight: 800; text-align: center; line-height: 1.15; }
  .bv-sotto { margin: 0 0 26px; text-align: center; color: var(--tenue); font-size: 17px; }
  .bv h2 { text-align: center; margin: 0 0 12px; font-size: 15px; }
  /* Lingua dell'operatore: schede morbide su 2 colonne, cerchietto a sinistra */
  .bv-lingue { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 26px; }
  .bv-lingue button {
    display: flex; align-items: center; gap: 8px; min-width: 0; padding: 9px 8px; text-align: start;
    background: linear-gradient(135deg, var(--lg1), var(--lg2)); color: var(--testo);
    border: 2px solid transparent; border-radius: 16px; box-shadow: var(--ombra); font: inherit;
  }
  .bv-lingue .sigla {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, #5fb6e3, #56c19a); color: #fff; font-size: 16px; font-weight: 800;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.5);
  }
  .bv-lingue .nomi { min-width: 0; display: flex; flex-direction: column; }
  .bv-lingue b { font-size: 16px; line-height: 1.2; white-space: nowrap; letter-spacing: -0.2px; }
  .bv-lingue small { font-size: 12.5px; color: var(--tenue); }
  .bv-lingue button.attiva { border-color: var(--blu); background: var(--blu-chiaro); }
  .bv-lingue .sigla.bandiera { background: #fff; overflow: hidden; font-size: 24px; line-height: 1; box-shadow: 0 0 0 2px #fff, var(--ombra); }
  /* la bandiera (emoji) ingrandita dal centro, così il cerchietto mostra il centro della bandiera */
  .bv-lingue .sigla.bandiera span { display: block; line-height: 1; transform: scale(1.8); }
  .bv-lingue .sigla.arabo { background: #007a3d; font-size: 20px; box-shadow: 0 0 0 2px #fff; }
  .bv-lingue button.attiva .sigla { box-shadow: 0 0 0 3px var(--blu); }
  .bv-ruoli { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bv-ruolo {
    --c: #1b86c2;
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 8px 16px;
    background: linear-gradient(135deg, var(--lg1), var(--lg2)); color: var(--testo); border: 2px solid transparent; border-top: 8px solid var(--c);
    border-radius: 18px; box-shadow: var(--ombra); font: inherit; cursor: pointer;
  }
  .bv-ruolo:active { transform: scale(.97); }
  .bv-ruolo.ultimo { border-color: var(--blu); background: var(--blu-chiaro); }
  .bv-ruolo .simbolo { font-size: 40px; line-height: 1.1; }
  .bv-ruolo b { font-size: 19px; line-height: 1.2; }
  .bv-ruolo small { font-size: 13.5px; color: var(--tenue); line-height: 1.3; }
  .bv-ruolo.r-M { --c: #1f4e8c; } .bv-ruolo.r-A { --c: #5b5bc9; } .bv-ruolo.r-S { --c: #2e7d4f; } .bv-ruolo.r-I { --c: #5f7f9c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .bv-ruolo.r-M { --c: #7fa8e6; } :root:not([data-theme="light"]) .bv-ruolo.r-A { --c: #9d9cf2; }
    :root:not([data-theme="light"]) .bv-ruolo.r-S { --c: #6cc793; } :root:not([data-theme="light"]) .bv-ruolo.r-I { --c: #b9cadb; }
  }
  :root[data-theme="dark"] .bv-ruolo.r-M { --c: #7fa8e6; } :root[data-theme="dark"] .bv-ruolo.r-A { --c: #9d9cf2; }
  :root[data-theme="dark"] .bv-ruolo.r-S { --c: #6cc793; } :root[data-theme="dark"] .bv-ruolo.r-I { --c: #b9cadb; }
  .bv-tutti {
    display: block; margin: 16px auto 0; border: 0; background: transparent; color: var(--blu);
    font: inherit; font-size: 16px; font-weight: 700; text-decoration: underline; padding: 10px;
  }

  /* Schermata grande per il paziente */
  #grande {
    position: fixed; inset: 0; z-index: 20; background: var(--sfondo); display: none;
    flex-direction: column; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto;
  }
  #grande.aperto { display: flex; }
  .barra { display: flex; justify-content: space-between; gap: 10px; }
  .barra button {
    border: 0; border-radius: 999px; padding: 11px 20px; font: inherit; font-size: 17px; font-weight: 700;
    background: linear-gradient(135deg, var(--lg1), var(--lg2)); color: var(--testo); box-shadow: var(--ombra);
  }
  .barra .ascolta { background: var(--blu); border-color: var(--blu); color: #fff; }
  #g-testo { font-size: 34px; font-weight: 700; line-height: 1.3; margin: 28px 0 14px; text-wrap: balance; }
  #g-testo[dir="rtl"] { font-size: 38px; }
  #g-it { font-size: 17px; color: var(--tenue); margin: 0 0 20px; }
  .risposte { display: grid; gap: 12px; margin-top: auto; }
  .risposte.due { grid-template-columns: 1fr 1fr; }
  .risposte button {
    border: 0; border-radius: 16px; padding: 22px 10px; font: inherit; font-size: 26px; font-weight: 700;
    color: #fff; background: var(--verde);
  }
  .risposte .no { background: var(--rosso); }
  .risposte .altra { background: var(--blu); }
  .scala { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: auto; }
  .scala button {
    border: 0; border-radius: 12px; padding: 16px 0; font: inherit; font-size: 24px; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .scala-etichette { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; margin-top: 8px; }
  #g-risposta {
    display: none; margin-top: 18px; padding: 18px; border-radius: 16px; background: var(--carta); color: var(--testo);
    border: 3px solid var(--blu); font-size: 30px; font-weight: 700; text-align: center;
  }
  #g-risposta small { display: block; font-size: 15px; font-weight: 400; color: var(--tenue); margin-bottom: 4px; }

  /* Tabella a immagini (paziente che non può parlare) */
  .tabella { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .tabella button {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 8px;
    background: linear-gradient(135deg, var(--lg1), var(--lg2)); color: var(--testo); border: 3px solid transparent; border-radius: 16px; box-shadow: var(--ombra); font: inherit;
  }
  .tabella button:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .tabella .simbolo { font-size: 40px; line-height: 1.1; }
  /* Figure disegnate (tabella e risposte a bottoni): grandi e chiare per il paziente */
  .tabella .figura { width: 88px; height: 88px; padding: 4px; background: #fff; border-radius: 14px; }
  .risposte button { display: flex; align-items: center; gap: 14px; text-align: start; }
  .risposte.due button { justify-content: center; }
  .risposte .riquadro { flex: none; width: 76px; height: 76px; padding: 4px; background: #fff; border-radius: 14px; }
  .risposte .riquadro .figura { width: 100%; height: 100%; display: block; }
  .tabella b { font-size: 21px; line-height: 1.2; }
  .tabella small { font-size: 14px; color: var(--tenue); }
  .tabella button.accesa { border-color: var(--blu); background: var(--blu-chiaro); transform: scale(1.03); }
  /* Scheda tè/caffè/camomilla: 3 figure per riga */
  .tre { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .tre button {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px;
    background: linear-gradient(135deg, var(--lg1), var(--lg2)); color: var(--testo); border: 3px solid transparent; border-radius: 16px; box-shadow: var(--ombra); font: inherit; min-width: 0;
  }
  .tre .figura { width: 100%; max-width: 76px; aspect-ratio: 1; height: auto; padding: 3px; background: #fff; border-radius: 12px; }
  .tre b { font-size: 17px; line-height: 1.2; text-align: center; overflow-wrap: anywhere; }
  .tre small { font-size: 13px; color: var(--tenue); }
  .tre button.accesa { border-color: var(--verde); background: var(--blu-chiaro); }
  .domanda2 { font-size: 22px; font-weight: 700; margin: 18px 2px 8px; }
  .scorri { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .scorri button { border: 0; border-radius: 16px; padding: 18px 8px; font: inherit; font-size: 22px; font-weight: 700; color: #fff; background: var(--blu); }
  .scorri .questa { background: var(--verde); }
  .aiuto-tabella { font-size: 15px; color: var(--tenue); margin: 10px 2px 0; }
  @media (prefers-reduced-motion: reduce) { .tabella button.accesa { transform: none; } }

  /* Firma dell'ideatore */
  .firma {
    margin-top: 36px; padding: 22px 16px 10px; border-top: 1px solid var(--bordo);
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  }
  .firma .marchio { width: 40px; height: 40px; margin-bottom: 4px; }
  .firma-etichetta { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--tenue); }
  .firma-nome { font-family: "Caveat", "Segoe Script", "Brush Script MT", cursive; font-size: 36px; font-weight: 600; line-height: 1.1; color: var(--blu); }
  .firma-nota { font-size: 13px; color: var(--tenue); max-width: 34ch; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div class="testata">

    <h1>MedTranslator</h1>

  function scegliCasella(k) {
    if (k < 0) return;
    if (casella >= 0) document.getElementById('casella-' + casella).classList.remove('accesa');
    casella = k;
    document.getElementById('casella-' + k).classList.add('accesa');
    risposta(tabAttiva[k][op + 1]);
  }

  function chiudi() {
    document.getElementById('grande').classList.remove('aperto');
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (window.TTS && window.TTS.stop) { try { window.TTS.stop(); } catch (e) {} }
    aperta = null;
  }

  function parla() {
    if (aperta) parlaTesto(aperta.t[aperta.tipo === 'tabella' ? lingua : lingua]);
  }
  function parlaTesto(testo) {
    // Nell'app Android la voce passa dal plugin TTS (la voce del telefono);
    // nel browser si usa speechSynthesis.
    if (window.TTS && window.TTS.speak) {
      try { window.TTS.speak({ text: testo.replace(/\.\.\.|……/g, ''), locale: info().voce, rate: 0.9 }, function () {}, function () {}); } catch (e) {}
      return;
    }
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(testo.replace(/\.\.\.|……/g, ''));
    u.lang = info().voce; u.rate = 0.9;
    var v = speechSynthesis.getVoices().filter(function (x) { return x.lang && x.lang.replace('_', '-').indexOf(info().id) === 0; });
    if (v.length) u.voice = v[0];
    speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) speechSynthesis.getVoices();

  // Giorno / notte. "auto" segue il tema del telefono; si può forzare giorno o notte
  // (es. da una stanza buia alla sala operatoria illuminata). Resta salvato.
  var TEMI = [['auto', '🌓', 'Automatico (come il telefono)'], ['light', '☀️', 'Sempre giorno'], ['dark', '🌙', 'Sempre notte']];
  var tema = 'auto';
  try { var t0 = localStorage.getItem('trad_tema'); if (t0 === 'light' || t0 === 'dark') tema = t0; } catch (e) {}
  function applicaTema() {
    if (tema === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', tema);
    var t = TEMI.filter(function (x) { return x[0] === tema; })[0];
    var b = document.getElementById('btn-tema');
    b.innerHTML = t[1] + (tema === 'auto' ? '<small>A</small>' : '');
    b.setAttribute('aria-label', 'Giorno o notte: ' + t[2] + '. Tocca per cambiare');
    return t;
  }
  var tempoAvviso;
  function cambiaTema() {
    var i = TEMI.map(function (x) { return x[0]; }).indexOf(tema);
    tema = TEMI[(i + 1) % TEMI.length][0];
    try { localStorage.setItem('trad_tema', tema); } catch (e) {}
    var t = applicaTema(), a = document.getElementById('avviso');
    a.textContent = t[1] + ' ' + t[2]; a.classList.add('visibile');
    clearTimeout(tempoAvviso); tempoAvviso = setTimeout(function () { a.classList.remove('visibile'); }, 1600);
  }
  applicaTema();

  // Tasto Indietro di Android: chiude la frase aperta invece di uscire.
  window.addEventListener('popstate', function () { if (aperta) chiudi(); });
  // App Android: il tasto Indietro chiude la frase aperta; dalle frasi torna
  // alla schermata di benvenuto; dal benvenuto esce dall'app.
  document.addEventListener('backbutton', function (e) {
    e.preventDefault();
    if (aperta) chiudi();
    else if (document.body.classList.contains('cercando')) chiudiCerca();
    else if (!benvenutoAperto) apriBenvenuto();
    else if (navigator.app && navigator.app.exitApp) navigator.app.exitApp();
  }, false);
  var apriOriginale = apri;
  apri = function (i) { apriOriginale(i); try { history.pushState({ f: i }, ''); } catch (e) {} };
  var chiudiOriginale = chiudi;
  chiudi = function () { var era = aperta; chiudiOriginale(); if (era && history.state && history.state.f !== undefined) history.back(); };

  disegna();
  apriBenvenuto();
</script>
